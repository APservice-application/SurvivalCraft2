name: Deploy เกมขึ้น GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/data/**"
      - "tools/build-web.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ติดตั้ง dependencies
        run: npm install --no-audit --no-fund
      - name: Build เกมเป็นไฟล์เดียว + คัดลอกไฟล์ PWA
        run: |
          npm run build
          mkdir -p _site
          cp web/dist/index.html _site/index.html
          cp web/manifest.webmanifest _site/manifest.webmanifest
          cp web/sw.js _site/sw.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
